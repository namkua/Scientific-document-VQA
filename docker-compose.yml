services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vqa-jenkins
    user: root
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.kube:/root/.kube:ro
      - ~/.kube:/var/jenkins_home/.kube:ro
      - ~/.minikube:/Users/namnguyen/.minikube:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.minikube.internal:host-gateway"
    restart: unless-stopped

volumes:
  jenkins_data:
